[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "matoi-rich-presence"
version = "0.0.0"
description = "MatoiRichPresence desktop Discord Rich Presence client for Windows"
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "MatoiRichPresence contributors"}]
dependencies = ["PySide6==6.11.2"]

[project.scripts]
matoi-rich-presence = "matoi_rich_presence.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["matoi_rich_presence", "matoi_rich_presence.core", "matoi_rich_presence.ui"]
